version: '3.8'

services:
  campus-event-board:
    build:
      context: .
      dockerfile: Dockerfile
    image: campus-event-ci
    container_name: campus-event-ansible
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - SECRET_KEY=campus-event-board-production-secret-2026
      - DB_DIR=/app/data
      - PORT=5000
    volumes:
      - eventboard_data:/app/data

volumes:
  eventboard_data:
    name: eventboard_data
